[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eascca-cues"
version = "0.1.0"
description = "Local Qwen assisted annotation of observable classroom cues"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3", "pydantic>=2.7,<3"]

[project.optional-dependencies]
vlm = ["transformers>=4.51,<5", "accelerate>=1.2,<2", "qwen-vl-utils>=0.0.8,<0.1", "huggingface-hub>=0.30,<1", "opencv-python-headless>=4.10,<5"]
dev = ["ruff>=0.9", "build>=1.2"]

[project.scripts]
eascca-cues = "cue_annotation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
