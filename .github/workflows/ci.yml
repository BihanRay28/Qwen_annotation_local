name: Core integrity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' 'opencv-python-headless>=4.10,<5'
      - run: ruff check src tests scripts
      - if: runner.os == 'Linux'
        run: bash -n scripts/run_all_pilots.sh scripts/run_full_dataset.sh scripts/spark.sh
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: eascca-cues --help
